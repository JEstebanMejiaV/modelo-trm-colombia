name: Verificar modelo

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  reproducibilidad:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar runtime y QA fijados
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip install PyWavelets==1.9.0
          python -m pip install -e . --no-deps

      - name: Comprobar wheel de código checkout-bound
        shell: bash
        run: |
          wheel_dir="$RUNNER_TEMP/trm-wheel"
          mkdir -p "$wheel_dir"
          python -m pip wheel . --no-deps --wheel-dir "$wheel_dir"
          python -S - "$wheel_dir" <<'PY'
          import sys
          from pathlib import Path
          from zipfile import ZipFile

          wheel = next(Path(sys.argv[1]).glob("*.whl"))
          names = ZipFile(wheel).namelist()
          assert any(name.endswith("trm_model/output_contract.py") for name in names)
          assert not any(name.startswith("configs/") for name in names)
          assert not any(name.startswith("data/raw/") for name in names)
          sys.path[:0] = [str(wheel)]
          import trm_model
          from trm_model.output_contract import MONTHLY_GENERATED_OUTPUT_COUNT

          assert trm_model.__version__ == "0.1.0"
          assert MONTHLY_GENERATED_OUTPUT_COUNT > 0
          print(f"OK: {wheel.name} importa fuera del checkout de datos")
          PY

      - name: Verificar ausencia de tests wavelet retirados
        shell: bash
        run: |
          if find tests -type f \( -name 'test_wavelet_optimization_*.py' -o -name '*wavelet_optimization*' \) -print -quit | grep -q .; then
            echo "Existen archivos de test wavelet optimization retirados."
            exit 1
          fi
          if grep -R -n --exclude-dir='__pycache__' --include='*.py' 'wavelet_optimization' tests; then
            echo "Existen referencias wavelet_optimization en tests."
            exit 1
          fi
          if git grep -n 'wavelet_optimization' -- .github/workflows \
              ':(exclude).github/workflows/model-check.yml' \
              ':(exclude).github/workflows/monthly-refresh.yml'; then
            echo "Existen referencias wavelet_optimization en otros workflows."
            exit 1
          fi

      - name: Compilar fuentes
        run: python -m compileall -q src pipelines research tests

      - name: Validar arquitectura, seguridad y ownership
        run: python src/check_architecture.py

      - name: Validar contratos y leakage
        run: trm-model validate

      - name: Ejecutar suite CI determinista mínima
        run: |
          # Se ejecutan sólo los contratos y tests de dispatch legacy; las
          # properties quedan disponibles para una validación completa/manual.
          python -m pytest -q \
            tests/test_contracts.py \
            tests/test_temporal_contracts.py \
            tests/test_long_horizon_dispatch.py

      - name: Ejecutar pipeline mensual con manifest
        run: trm-model run-monthly

      - name: Verificar manifest de corrida y ownership mensual
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          from trm_model.output_contract import (
              MONTHLY_GENERATED_OUTPUT_COUNT,
              flatten_output_ownership,
              monthly_generated_output_ownership,
              validate_run_output_ownership,
          )

          manifests = sorted(Path("artifacts/runs").glob("*/manifest.json"))
          assert manifests, "No se generó ningún manifest de corrida"
          manifest = json.loads(manifests[-1].read_text(encoding="utf-8"))
          assert manifest["status"] == "success"
          assert manifest["product_id"] == "monthly_bundle"
          assert len(manifest["input_files"]) == 26
          assert {item["product_id"] for item in manifest["products"]} == {
              "monthly_explanation", "monthly_forecast", "robustness"
          }
          expected_outputs = set(
              flatten_output_ownership(monthly_generated_output_ownership())
          )
          actual_outputs = {item["path"] for item in manifest["output_files"]}
          assert len(actual_outputs) == MONTHLY_GENERATED_OUTPUT_COUNT
          assert actual_outputs == expected_outputs
          validate_run_output_ownership(
              manifest,
              expected_product_ids={"monthly_explanation", "monthly_forecast", "robustness"},
          )
          assert manifest["config_records"]
          assert manifest["contract_tree_sha256"]
          assert manifest["source_tree_sha256"]
          PY

      - name: Reconstruir gráficos explicativos
        run: python src/build_charts.py

      - name: Sincronizar workbook por fallback reproducible
        run: python src/sync_workbook_openpyxl.py

      - name: Comprobar sincronización de gráficos versionados
        run: python src/check_charts.py

      - name: Comprobar reproducibilidad de resultados versionados
        run: python src/check_reproducibility.py

      - name: Comprobar resultados y archivo Excel final
        run: python src/check_outputs.py
