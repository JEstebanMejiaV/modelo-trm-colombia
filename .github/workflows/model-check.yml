name: Verificar modelo

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  reproducibilidad:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Reestimar modelo
        run: python src/estimate_model.py

      - name: Comprobar resultados y archivo Excel final
        run: python src/check_outputs.py
