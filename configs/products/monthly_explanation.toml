schema_version = 1
product_id = "monthly_explanation"
label = "Explicación histórica mensual"
frequency = "monthly"
horizon_months = 0
information_set = "ex_post"
vintage_policy = "latest_available"
status = "primary"
benchmark = "random_walk"
source_of_truth = "artifacts/runs"

[model]
reference_model_id = "controles_externos"
integrated_model_id = "marco_macro_integral"
estimator = "ols_hac"
hac_maxlags = 6
factor_count = 14
factor_interpretation_output = "results/explicacion/interpretacion_factores_marco_macro_integral.csv"
factor_contribution_outputs = [
  "results/explicacion/contribuciones_factores_controles_externos.csv",
  "results/explicacion/contribuciones_factores_marco_macro_integral.csv",
]
dynamic_mediation = true
dynamic_mediation_method = "observational_dynamic_path_diagnostic"
dynamic_mediation_schema = "schemas/monthly_dynamic_mediation.json"
dynamic_mediation_outputs = [
  "results/explicacion/mediacion_dinamica_coeficientes_etapas.csv",
  "results/explicacion/mediacion_dinamica_rutas.csv",
  "results/explicacion/mediacion_dinamica_bootstrap.csv",
  "results/explicacion/mediacion_dinamica_contribuciones.csv",
]

[validation]
holdout_months = 48
causal_interpretation = false
