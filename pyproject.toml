[build-system]
requires = ["setuptools>=68,<85", "wheel>=0.42,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "modelo-trm-colombia"
version = "0.1.0"
description = "Modelo reproducible de explicación, pronóstico y riesgo de la TRM colombiana"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "numpy>=2.2,<3",
  "pandas>=2.2,<4",
  "scipy>=1.13,<2",
  "statsmodels>=0.14.4,<0.15",
  "openpyxl>=3.1,<4",
  "matplotlib>=3.9,<4",
  "Pillow>=11,<13",
]

[project.optional-dependencies]
daily = [
  "scikit-learn>=1.5,<2",
  "xgboost>=2,<4",
  "lightgbm>=4,<5",
]
rnn = ["torch>=2.2,<3"]
longterm = ["PyWavelets>=1.6,<2"]
risk = ["arch>=7,<9"]
test = ["pytest>=8,<10"]
all = [
  "scikit-learn>=1.5,<2",
  "xgboost>=2,<4",
  "lightgbm>=4,<5",
  "torch>=2.2,<3",
  "PyWavelets>=1.6,<2",
  "arch>=7,<9",
  "pytest>=8,<10",
]

[project.scripts]
trm-model = "trm_model.cli:main"
trm-archive-vintage = "archive_vintage:main"
trm-monthly = "pipelines.monthly:run_monthly"
trm-daily-direction = "pipelines.daily_direction:run"
trm-daily-volatility = "pipelines.daily_volatility:run"

[tool.setuptools]
package-dir = {"" = "src", "pipelines" = "pipelines", "research" = "research"}
packages = [
  "model",
  "trm_model",
  "trm_model.data",
  "trm_model.experiments",
  "trm_model.features",
  "trm_model.provenance",
  "trm_model.specifications",
  "trm_model.validation",
  "forecast_daily",
  "forecast_longterm",
  "pipelines",
  "research",
]
py-modules = ["archive_vintage", "estimate_model", "forecast_short_term", "download_global_data", "volatility_model"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
